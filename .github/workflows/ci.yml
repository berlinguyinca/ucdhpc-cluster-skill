name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck (warnings and above)
        run: shellcheck -S warning ucd-hpc/scripts/*.sh tests/*.sh
      - name: bash syntax
        run: for f in ucd-hpc/scripts/*.sh tests/*.sh; do bash -n "$f"; done
      - name: maintenance.sh tests
        run: bash tests/test-maintenance.sh
      - name: evals.json is valid JSON
        run: python3 -m json.tool ucd-hpc/evals/evals.json > /dev/null
